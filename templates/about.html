{% extends "base.html" %}
{% block content %}
{%- set photo = resize_image(path="about/headshot.jpg", width=560, height=560, op="fill", format="webp", quality=85) %}
<article class="wrap page-head about">
  <img class="about-photo" src="{{ photo.url }}?v={{ get_hash(path="content/about/headshot.jpg", sha_type=256, base64=false) | truncate(length=12, end="") }}" width="280" height="280" alt="Ulysse Corne">
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ page.content | safe }}</div>
</article>
{% endblock %}
