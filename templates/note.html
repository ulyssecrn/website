{% extends "base.html" %}
{% block content %}
<article class="wrap note">
  <a class="back" href="{{ get_url(path='@/notes/_index.md') }}"><span aria-hidden="true">←</span> Notes</a>
  <p class="kicker">{{ page.date | date(format="%B %-d, %Y") }}{% if page.extra.kind is defined %} · {{ page.extra.kind }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ page.content | safe }}</div>
</article>
{% endblock %}
